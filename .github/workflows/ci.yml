name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jajacare
          POSTGRES_PASSWORD: jajacare
          POSTGRES_DB: jajacare_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jajacare"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://jajacare:jajacare@localhost:5432/jajacare_test?schema=public
      JWT_ACCESS_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Real Postgres: builds the schema, adds the overlap constraint, then runs the end-to-end suite.
      - run: npm run test:e2e:setup
      - run: npm run test:e2e
